<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Image Pan & Zoom</title>

<style>
:root{
  --bg:#0b0f14;
  --panel:rgba(15,23,42,.78);
  --border:rgba(148,163,184,.22);
  --text:#e5e7eb;
  --muted:#94a3b8;
}

html,body{
  margin:0;
  height:100%;
  background:var(--bg);
  overflow:hidden;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  user-select:none;
}

#stage{
  position:relative;
  width:100vw;
  height:100vh;
  cursor:grab;
}
#stage.dragging{cursor:grabbing}

#img{
  position:absolute;
  left:50%;
  top:50%;
  transform-origin:0 0;
  will-change:transform;
  pointer-events:none;
}

/* ===== PANEL DỌC ===== */
#panel{
  position:absolute;
  top:12px;
  left:12px;
  width:56px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:6px;
  display:flex;
  flex-direction:column;
  gap:6px;
  backdrop-filter:blur(8px);
  transition:.2s ease;
}

#panel.expanded{
  width:190px;
  align-items:flex-start;
}

.btn{
  width:100%;
  background:rgba(2,6,23,.45);
  border:1px solid var(--border);
  color:var(--text);
  padding:6px;
  border-radius:10px;
  font-size:12px;
  cursor:pointer;
  text-align:left;
}
.btn:hover{background:rgba(2,6,23,.65)}

.icon{
  text-align:center;
  font-size:14px;
}

.label{
  display:none;
  margin-left:6px;
}
#panel.expanded .label{display:inline}

.scale{
  text-align:center;
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}

kbd{
  background:rgba(148,163,184,.15);
  border:1px solid rgba(148,163,184,.25);
  border-radius:6px;
  padding:1px 5px;
  font-size:11px;
}
</style>
</head>

<body>
<div id="stage">
  <img id="img">

  <!-- PANEL -->
  <div id="panel">
    <button class="btn" id="toggle"><span class="icon">☰</span><span class="label"> Menu</span></button>
    <button class="btn" id="fit"><span class="icon">⛶</span><span class="label"> Fit (F)</span></button>
    <button class="btn" id="z100"><span class="icon">1×</span><span class="label"> 100% (1)</span></button>
    <button class="btn" id="reset"><span class="icon">↺</span><span class="label"> Reset (0)</span></button>
    <div class="scale" id="scaleTxt">1.00×</div>
  </div>
</div>

<script>
/* ===== ĐỔI TÊN ẢNH Ở ĐÂY ===== */
const IMAGE_FILE = "my-image.jpg";

const stage = document.getElementById("stage");
const img = document.getElementById("img");
const panel = document.getElementById("panel");
const scaleTxt = document.getElementById("scaleTxt");

img.src = IMAGE_FILE;

let scale=1, x=0, y=0;
let dragging=false, lx=0, ly=0;

const MIN=0.03, MAX=40;

function apply(){
  img.style.transform=`translate(${x}px,${y}px) scale(${scale})`;
  scaleTxt.textContent=scale.toFixed(2)+"×";
}

function fit(){
  const r=stage.getBoundingClientRect();
  const w=img.naturalWidth, h=img.naturalHeight;
  if(!w||!h) return;
  scale=Math.min((r.width-80)/w,(r.height-80)/h);
  scale=Math.min(scale,8);
  x=-(w*scale)/2;
  y=-(h*scale)/2;
  apply();
}

function reset(){ fit(); }

function set100(){
  const w=img.naturalWidth, h=img.naturalHeight;
  scale=1;
  x=-(w/2);
  y=-(h/2);
  apply();
}

function zoomAt(cx,cy,f){
  const r=stage.getBoundingClientRect();
  const mx=cx-r.left-r.width/2;
  const my=cy-r.top-r.height/2;
  const ns=Math.min(MAX,Math.max(MIN,scale*f));
  const wx=(mx-x)/scale;
  const wy=(my-y)/scale;
  scale=ns;
  x=mx-wx*scale;
  y=my-wy*scale;
  apply();
}

/* mouse */
stage.addEventListener("mousedown",e=>{
  dragging=true; lx=e.clientX; ly=e.clientY;
  stage.classList.add("dragging");
});
window.addEventListener("mousemove",e=>{
  if(!dragging) return;
  x+=e.clientX-lx; y+=e.clientY-ly;
  lx=e.clientX; ly=e.clientY;
  apply();
});
window.addEventListener("mouseup",()=>{
  dragging=false; stage.classList.remove("dragging");
});

/* wheel */
stage.addEventListener("wheel",e=>{
  e.preventDefault();
  zoomAt(e.clientX,e.clientY,Math.pow(1.0015,-e.deltaY));
},{passive:false});

/* keys */
window.addEventListener("keydown",e=>{
  if(e.key==="0") reset();
  else if(e.key==="f"||e.key==="F") fit();
  else if(e.key==="1") set100();
  else if(e.key==="+"||e.key==="=") zoomAt(innerWidth/2,innerHeight/2,1.15);
  else if(e.key==="-"||e.key==="_") zoomAt(innerWidth/2,innerHeight/2,1/1.15);
});

/* panel */
document.getElementById("toggle").onclick=()=>panel.classList.toggle("expanded");
document.getElementById("fit").onclick=fit;
document.getElementById("reset").onclick=reset;
document.getElementById("z100").onclick=set100;

img.onload=fit;
</script>
</body>
</html>
